[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polytempo"
version = "0.1.0"
description = "Deterministic weather-market analysis tool."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "httpx",
    "pydantic",
    "truststore; python_version >= '3.10'",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
polytempo = "polytempo.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
