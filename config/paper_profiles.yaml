# Paper trading profiles: model × trade strategy × lead-time entry gate.
# Twelve combinations by default (2 × 3 × 2).

active_profiles: all_twelve

city: london
target_day: tomorrow

calibration_stats_path: data/weather/statistical/calibration_stats.csv
updated_calibration_stats_path: data/weather/statistical/calibration_stats_updated.csv

# Bot wakes at the exact UTC instant when lead_hours == target_lead_hours
# (± tolerance_seconds, default 90s). Not a multi-hour window.
lead_gates:
  lead12:
    target_lead_hours: 12
  lead15:
    target_lead_hours: 15
  lead18:
    target_lead_hours: 18
  lead24:
    target_lead_hours: 24
  lead30:
    target_lead_hours: 30
  lead36:
    target_lead_hours: 36
  lead42:
    target_lead_hours: 42
  lead48:
    target_lead_hours: 48
  lead54:
    target_lead_hours: 54

model_strategies:
  - best_historical
  - ensemble_spread
  - best_historical_updated

trade_strategies:
  - argmax_yes
  - argmax_no
  - dist_arb
  - mid_band
  - topk_yes
  - topk_no
  - max_edge
  - edge_band

# Profile ids generated as: {bh|es}_{trade}_{lead30|lead24}
# e.g. bh_dist_arb_lead30, es_mid_band_lead24
