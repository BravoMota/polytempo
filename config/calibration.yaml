start_date: "2026-02-01"
schedule_anchor_time_utc: "02:00"
updated_stats_csv: data/weather/statistical/calibration_stats_updated.csv

collector_config: config/weather_collectors.yaml
station_ids:
  - EGLC
  - LEMD

# Default model set (used by any station without a `station_models` override).
models:
  - name: ukmo_uk_deterministic_2km
    run_init_interval_hours: 3
    forecast_days: 3
  - name: ukmo_global_deterministic_10km
    run_init_interval_hours: 6
    forecast_days: 7
  - name: ecmwf_ifs025
    run_init_interval_hours: 6
    forecast_days: 15
  - name: icon_eu
    run_init_interval_hours: 3
    forecast_days: 5
  - name: gfs_seamless
    run_init_interval_hours: 6
    forecast_days: 16

# Per-station overrides. Must mirror the station's `models:` in
# config/weather_collectors.yaml so calibration is fitted over the same model
# set the trading path later requests.
station_models:
  LEMD:
    - name: meteofrance_arpege_europe
      run_init_interval_hours: 6
      forecast_days: 4
    - name: icon_eu
      run_init_interval_hours: 3
      forecast_days: 5
    - name: ecmwf_ifs025
      run_init_interval_hours: 6
      forecast_days: 15
    - name: gfs_seamless
      run_init_interval_hours: 6
      forecast_days: 16
    - name: ukmo_global_deterministic_10km
      run_init_interval_hours: 6
      forecast_days: 7

wunderground_forecast:
  enabled: true
  model: wunderground
  max_lead_hours: 60
  forecast_snapshot_min_utc: "2026-06-06T20:00:00Z"
