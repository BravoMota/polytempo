raw_base_dir: data/weather/raw

collectors:
  - name: wunderground
    enabled: true
    source: wunderground
    # Observations: poll every 5 min on UTC wall-clock slots from anchor.
    # observations_interval_seconds: 300
    # observations_anchor_time_utc: "00:00"   # slots at …:00, …:05, …:10 UTC
    observations_interval_seconds: 300
    observations_anchor_time_utc: "00:00"
    # Forecasts: poll every hour on UTC wall-clock slots from anchor.
    # forecast_interval_seconds: 3600
    # forecast_anchor_time_utc: "00:00"       # slots at 00:00, 01:00, 02:00 UTC
    forecast_interval_seconds: 600
    forecast_anchor_time_utc: "00:00"
    stations:
      - station_id: EGLC
        station_type: icao
        name: London City Airport
        timezone: Europe/London
        lat: 51.5053
        lon: 0.0553
        country: gb
        city_slug: london
        pws_id: null
      - station_id: ILONDO288
        station_type: pws
        name: Hoskins Close
        timezone: Europe/London
        lat: 51.5053
        lon: 0.0553
        country: gb
        city_slug: london
        pws_id: ILONDO288
      - station_id: LEMD
        station_type: icao
        name: Madrid-Barajas
        timezone: Europe/Madrid
        lat: 40.4936
        lon: -3.5668
        country: es
        city_slug: madrid
        pws_id: null
      - station_id: LIMC
        station_type: icao
        name: Milan Malpensa
        timezone: Europe/Rome
        lat: 45.6306
        lon: 8.7281
        country: it
        city_slug: milan
        pws_id: null

  - name: open_meteo
    enabled: true
    source: open_meteo
    forecast_interval_seconds: 600
    forecast_anchor_time_utc: "00:00"
    observations_interval_seconds: 86400
    models:
      - ukmo_uk_deterministic_2km
      - ukmo_global_deterministic_10km
      - ecmwf_ifs025
      - icon_eu
      - gfs_seamless
    target_horizon_days: 4
    stations:
      - station_id: EGLC
        station_type: icao
        name: London City Airport
        timezone: Europe/London
        lat: 51.5053
        lon: 0.0553
        country: gb
        city_slug: london
        pws_id: null
      - station_id: LEMD
        station_type: icao
        name: Madrid-Barajas
        timezone: Europe/Madrid
        lat: 40.4936
        lon: -3.5668
        country: es
        city_slug: madrid
        pws_id: null
        models:
          - meteofrance_arpege_europe
          - icon_eu
          - ecmwf_ifs025
          - gfs_seamless
          - ukmo_global_deterministic_10km
      - station_id: LIMC
        station_type: icao
        name: Milan Malpensa
        timezone: Europe/Rome
        lat: 45.6306
        lon: 8.7281
        country: it
        city_slug: milan
        pws_id: null
        models:
          - italia_meteo_arpae_icon_2i
          - icon_eu
          - ecmwf_ifs025
          - gfs_seamless
          - ukmo_global_deterministic_10km

  - name: polymarket_clob
    enabled: true
    source: polymarket_clob
    forecast_interval_seconds: 300
    forecast_anchor_time_utc: "00:00"
    observations_interval_seconds: 86400
    observations_anchor_time_utc: "00:00"
    target_horizon_days: 4
    stations:
      - station_id: EGLC
        station_type: icao
        name: London City Airport
        timezone: Europe/London
        lat: 51.5053
        lon: 0.0553
        country: gb
        city_slug: london
        pws_id: null
      - station_id: LEMD
        station_type: icao
        name: Madrid-Barajas
        timezone: Europe/Madrid
        lat: 40.4936
        lon: -3.5668
        country: es
        city_slug: madrid
        pws_id: null
      - station_id: LIMC
        station_type: icao
        name: Milan Malpensa
        timezone: Europe/Rome
        lat: 45.6306
        lon: 8.7281
        country: it
        city_slug: milan
        pws_id: null
