# Achilles live node — same trading envelope as Hermes: WHUMS × argmax_no ×
# lead 24, 8% of on-chain collateral per ticket. Launchd label stays
# com.polytempo.live-node (logs, .env, polytempo_live).
#
# mode: dry_run — full pipeline incl. sizing/risk/ledger, but orders are
#                 simulated in-process; nothing leaves the machine.
#       live    — real orders. Requires POLYMARKET_PRIVATE_KEY (and optionally
#                 POLYMARKET_WALLET_ADDRESS) plus POLYTEMPO_LIVE_CONFIRM=1 in
#                 the environment. Refuses to start otherwise.
mode: dry_run

city: london
target_day: tomorrow

# Simulated collateral when mode is dry_run (live mode reads the chain).
dry_run_balance_usd: 50.0

knob:
  id: whums_argmax_no_lead24_frac08_v1
  model_strategy: weighted_historical_market_sigma
  trade_strategy: argmax_no
  lead_gates: [24]                  # hours before end of target day

# Fraction of collateral_balance_usd per order. On a $50 wallet this is $4.
# Do not set fixed_usd here.
stake:
  fraction: 0.08

execution:
  # Ceiling on ask-walk (price units). Combined with slippage_edge_fraction:
  # walk = min(max_slippage, fraction * modeled edge). A 20¢ edge at 0.25
  # may pay 5¢ above best ask; a 2¢ edge barely walks. 0.90 still caps the
  # limit via risk.max_price.
  max_slippage: 0.08
  fill_timeout_seconds: 90
  # No impact floor: size whatever resting asks sit inside the walk window.
  min_depth_usd: 0.0
  slippage_edge_fraction: 0.25

# Dollar caps below are the $50-bankroll equivalents; the node scales them by
# balance / bankroll_ref_usd so the same percentages hold as the wallet grows.
risk:
  # Touch this file to halt all opening instantly (settlement still runs).
  kill_switch_file: config/KILL_LIVE
  bankroll_ref_usd: 50.0
  max_daily_loss_usd: 8.0           # 16% of ref
  max_open_exposure_usd: 15.0       # 30% of ref
  max_event_exposure_usd: 5.0       # one 8% ticket on the $50 ref plus headroom
  min_price: 0.02
  max_price: 0.90
  max_spread: 0.10
  max_forecast_age_hours: 6.0
