# Live trading node configuration.
#
# mode: dry_run — full pipeline incl. sizing/risk/ledger, but orders are
#                 simulated in-process; nothing leaves the machine.
#       live    — real orders. Requires POLYMARKET_PRIVATE_KEY (and optionally
#                 POLYMARKET_PROXY_ADDRESS / POLYMARKET_SIGNATURE_TYPE) plus
#                 POLYTEMPO_LIVE_CONFIRM=1 in the environment. Refuses to start
#                 otherwise.
mode: dry_run

city: london
target_day: tomorrow

# ── THE KNOB — PLACEHOLDER, deliberately undecided ────────────────────────────
# Which model x trade strategy x lead gates the node trades. The values below
# are a stand-in so the node can boot in dry_run; the real choice is pending
# the es-vs-bh A/B rerun. Change knob.id when the decision is made so ledger
# rows are attributable to the decided knob.
knob:
  id: knob_v0_placeholder
  model_strategy: ensemble_spread   # PLACEHOLDER
  trade_strategy: max_edge          # PLACEHOLDER
  lead_gates: [30, 42]              # PLACEHOLDER (hours before end of target day)

# Flat stake per order in v1 (no Kelly/fraction sizing until the knob is decided).
stake:
  fixed_usd: 10.0

execution:
  # Limit price = best_ask + max_slippage (capped by risk.max_price).
  max_slippage: 0.02
  # After this long, unfilled remainder is canceled and recorded.
  fill_timeout_seconds: 90
  # Resting depth (USD) within the slippage window required to quote at all.
  min_depth_usd: 50.0

risk:
  # Touch this file to halt all opening instantly (settlement still runs).
  kill_switch_file: config/KILL_LIVE
  max_daily_loss_usd: 50.0
  max_open_exposure_usd: 120.0
  max_event_exposure_usd: 40.0
  min_price: 0.02
  max_price: 0.90
  max_spread: 0.10
  max_forecast_age_hours: 6.0
